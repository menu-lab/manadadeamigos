  <script>
    // Alternancia estricta entre sonido1.mp3 y sonido2.mp3 por recarga
    const tracks = ['sonido1.mp3', 'sonido2.mp3'];
    let lastTrack = localStorage.getItem('lastPlayedTrack');
    let nextTrack = (lastTrack === 'sonido1.mp3') ? 'sonido2.mp3' : 'sonido1.mp3';
    localStorage.setItem('lastPlayedTrack', nextTrack);

    const audio = document.getElementById('bgMusic');
    audio.src = nextTrack;

    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const iconMuted = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const iconActive = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          soundIcon.innerHTML = `<path d="${iconActive}"/>`;
        }).catch(err => console.warn(err));
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        soundIcon.innerHTML = `<path d="${iconMuted}"/>`;
      }
    });

    // Accesorios estacionales automáticos
    function applySeasonalAccessories() {
      const month = new Date().getMonth();
      if (month === 8) {
        document.getElementById('chupallaHuaso').style.display = 'block';
        document.getElementById('remolino18').style.display = 'block';
      } else if (month === 9) {
        document.getElementById('sombreroBruja').style.display = 'block';
      } else if (month === 11) {
        document.getElementById('gorroNavidad').style.display = 'block';
      }
    }
    applySeasonalAccessories();

    // Huellas dinámicas en tono burdeos (#6b1d2f) cada 15 segundos
    const pawLayer = document.getElementById('pawLayer');
    const container = document.getElementById('appContainer');

    const pawSVG = `
      <svg viewBox="0 0 100 100" fill="#6b1d2f" width="100%" height="100%">
        <ellipse cx="50" cy="65" rx="22" ry="18"/>
        <circle cx="24" cy="38" r="9"/>
        <circle cx="41" cy="27" r="9"/>
        <circle cx="59" cy="27" r="9"/>
        <circle cx="76" cy="38" r="9"/>
      </svg>
    `;

    function walkPawsSequence() {
      const rect = container.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;

      const routes = [
        { x0: -30, y0: H * 0.22, x1: W + 30, y1: H * 0.28 },
        { x0: W + 30, y0: H * 0.42, x1: -30, y1: H * 0.48 },
        { x0: -30, y0: H * 0.62, x1: W + 30, y1: H * 0.70 },
        { x0: -30, y0: H * 0.15, x1: W + 30, y1: H * 0.85 },
        { x0: W + 30, y0: H * 0.80, x1: -30, y1: H * 0.20 }
      ];

      const route = routes[Math.floor(Math.random() * routes.length)];
      const totalDistance = Math.hypot(route.x1 - route.x0, route.y1 - route.y0);
      const stepDistance = 42;
      const steps = Math.floor(totalDistance / stepDistance);
      const angle = Math.atan2(route.y1 - route.y0, route.x1 - route.x0);
      const baseRotation = (angle * 180 / Math.PI) + 90;
      const stepSide = 12;

      for (let i = 0; i < steps; i++) {
        setTimeout(() => {
          const paw = document.createElement('div');
          paw.className = 'paw-print';
          paw.innerHTML = pawSVG;

          const currentDist = i * stepDistance;
          const sideOffset = (i % 2 === 0 ? 1 : -1) * stepSide;

          const posX = (route.x0 + Math.cos(angle) * currentDist) - Math.sin(angle) * sideOffset;
          const posY = (route.y0 + Math.sin(angle) * currentDist) + Math.cos(angle) * sideOffset;
          const rot = baseRotation + (i % 2 === 0 ? 6 : -6);

          paw.style.left = `${posX}px`;
          paw.style.top = `${posY}px`;
          paw.style.transform = `scale(0.5) rotate(${rot}deg)`;

          pawLayer.appendChild(paw);

          requestAnimationFrame(() => {
            paw.classList.add('visible');
            paw.style.transform = `scale(1) rotate(${rot}deg)`;
          });

          setTimeout(() => {
            paw.classList.remove('visible');
            paw.classList.add('fade-out');
            setTimeout(() => {
              paw.remove();
            }, 650);
          }, 1200);

        }, i * 220);
      }
    }

    // Inicio a los 5s y repetición cada 15 segundos exactos
    setTimeout(() => {
      walkPawsSequence();
      setInterval(walkPawsSequence, 15000);
    }, 5000);
  </script>

  </div>

  <script>
    // 1. Selector aleatorio entre sonido1.mp3 y sonido2.mp3
    const tracks = ['sonido1.mp3', 'sonido2.mp3'];
    const chosenTrack = tracks[Math.floor(Math.random() * tracks.length)];
    const audio = document.getElementById('bgMusic');
    audio.src = chosenTrack;

    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const iconMuted = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const iconActive = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          soundIcon.innerHTML = `<path d="${iconActive}"/>`;
        }).catch(err => console.warn("Audio bloqueado:", err));
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        soundIcon.innerHTML = `<path d="${iconMuted}"/>`;
      }
    });

    // 2. Accesorios estacionales automáticos por mes
    function applySeasonalAccessories() {
      const month = new Date().getMonth();
      if (month === 8) { // Septiembre
        document.getElementById('chupallaHuaso').style.display = 'block';
        document.getElementById('remolino18').style.display = 'block';
      } else if (month === 9) { // Octubre
        document.getElementById('sombreroBruja').style.display = 'block';
      } else if (month === 11) { // Diciembre
        document.getElementById('gorroNavidad').style.display = 'block';
      }
    }
    applySeasonalAccessories();

    // 3. Motor de Huellas Dinámicas de Pantalla Completa
    const pawLayer = document.getElementById('pawLayer');
    const container = document.getElementById('appContainer');

    const pawSVG = `
      <svg viewBox="0 0 100 100" fill="#3b4834" width="100%" height="100%">
        <ellipse cx="50" cy="65" rx="22" ry="18"/>
        <circle cx="24" cy="38" r="9"/>
        <circle cx="41" cy="27" r="9"/>
        <circle cx="59" cy="27" r="9"/>
        <circle cx="76" cy="38" r="9"/>
      </svg>
    `;

    function walkPawsSequence() {
      const rect = container.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;

      // Rutas posibles que cruzan de lado a lado en distintas alturas
      const routes = [
        { x0: -30, y0: H * 0.22, x1: W + 30, y1: H * 0.28 }, // Cruce superior
        { x0: W + 30, y0: H * 0.42, x1: -30, y1: H * 0.48 }, // Cruce medio hacia la izquierda
        { x0: -30, y0: H * 0.62, x1: W + 30, y1: H * 0.70 }, // Cruce medio-bajo
        { x0: -30, y0: H * 0.15, x1: W + 30, y1: H * 0.85 }, // Diagonal descendente completa
        { x0: W + 30, y0: H * 0.80, x1: -30, y1: H * 0.20 }  // Diagonal ascendente completa
      ];

      const route = routes[Math.floor(Math.random() * routes.length)];
      const totalDistance = Math.hypot(route.x1 - route.x0, route.y1 - route.y0);
      const stepDistance = 42; // Distancia entre pisadas
      const steps = Math.floor(totalDistance / stepDistance);
      const angle = Math.atan2(route.y1 - route.y0, route.x1 - route.x0);
      const baseRotation = (angle * 180 / Math.PI) + 90;
      const stepSide = 12; // Separación izquierda/derecha de patitas

      for (let i = 0; i < steps; i++) {
        setTimeout(() => {
          const paw = document.createElement('div');
          paw.className = 'paw-print';
          paw.innerHTML = pawSVG;

          const progress = i / steps;
          const currentDist = i * stepDistance;
          const sideOffset = (i % 2 === 0 ? 1 : -1) * stepSide;

          const posX = (route.x0 + Math.cos(angle) * currentDist) - Math.sin(angle) * sideOffset;
          const posY = (route.y0 + Math.sin(angle) * currentDist) + Math.cos(angle) * sideOffset;
          const rot = baseRotation + (i % 2 === 0 ? 6 : -6);

          paw.style.left = `${posX}px`;
          paw.style.top = `${posY}px`;
          paw.style.transform = `scale(0.5) rotate(${rot}deg)`;

          pawLayer.appendChild(paw);

          requestAnimationFrame(() => {
            paw.classList.add('visible');
            paw.style.transform = `scale(1) rotate(${rot}deg)`;
          });

          setTimeout(() => {
            paw.classList.remove('visible');
            paw.classList.add('fade-out');
            setTimeout(() => {
              paw.remove();
            }, 650);
          }, 1200);

        }, i * 220); // Cadencia de caminata continua
      }
    }

    // Primera caminata a los 5 segundos; luego cada 20 a 30 segundos
    setTimeout(() => {
      walkPawsSequence();
      function scheduleNextWalk() {
        const nextInterval = 20000 + Math.random() * 10000;
        setTimeout(() => {
          walkPawsSequence();
          scheduleNextWalk();
        }, nextInterval);
      }
      scheduleNextWalk();
    }, 5000);
  </script>
