<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Manada de Amigos - Pet Shop & Boutique</title>

  <!-- Favicon Oficial 32x32 px en Base64 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Cellipse cx='16' cy='21' rx='7.5' ry='6' fill='%234a5840'/%3E%3Cellipse cx='8' cy='13' rx='2.5' ry='3.5' transform='rotate(-20 8 13)' fill='%234a5840'/%3E%3Cellipse cx='13' cy='9.5' rx='2.5' ry='3.8' transform='rotate(-6 13 9.5)' fill='%234a5840'/%3E%3Cellipse cx='19' cy='9.5' rx='2.5' ry='3.8' transform='rotate(6 19 9.5)' fill='%234a5840'/%3E%3Cellipse cx='24' cy='13' rx='2.5' ry='3.5' transform='rotate(20 24 13)' fill='%234a5840'/%3E%3C/svg%3E">

  <!-- Tipografías e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #e8e2d5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    /* Contenedor Adaptativo Single-Viewport: Relación estricta 900x1700 */
    .app-container {
      position: relative;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      max-height: calc(100vw * (1700 / 900));
      aspect-ratio: 900 / 1700;
      background: #FFFFFF url('350594.jpg') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* Fallback para el nombre con copia si no ha sido renombrada */
    @supports not (background: url('350594.jpg')) {
      .app-container {
        background-image: url('350594.jpg - copia.jpg');
      }
    }

    /* Control de Sonido superior izquierdo */
    #soundToggle {
      position: absolute;
      top: 2.2%;
      left: 3.8%;
      width: 40px;
      height: 40px;
      z-index: 35;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(74, 88, 64, 0.2);
    }

    #soundIcon {
      width: 20px;
      height: 20px;
      fill: #4a5840;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #soundToggle.muted #soundIcon {
      opacity: 0.45;
      fill: #7d8b72;
    }

    /* ========================================================
       BOTONERA COMPACTA CALIBRADA:
       Comienza en 26.5% y finaliza en 62.8%
       DEJA TOTALMENTE LIBRES A LAS MASCOTAS (65.5% en adelante)
       ======================================================== */
    .buttons-wrapper {
      position: absolute;
      top: 26.2%;
      left: 8.5%;
      width: 83%;
      display: flex;
      flex-direction: column;
      gap: 7.5px; /* Espaciado compacto para máxima holgura inferior */
      z-index: 25;
    }

    .manada-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 7px 15px; /* Altura estilizada y delgada */
      background: #FFFFFF;
      border-radius: 50px;
      text-decoration: none;
      border: 1.5px solid #e5ded2;
      box-shadow: 0 3px 8px rgba(62, 74, 53, 0.08), 0 2px 0 #d1c6b4;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    }

    .manada-btn:active {
      transform: translateY(1.5px) scale(0.98);
      box-shadow: 0 1px 3px rgba(62, 74, 53, 0.1), 0 1px 0 #d1c6b4;
    }

    /* Icono circular a la izquierda */
    .manada-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-right: 12px;
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    /* Gradientes temáticos */
    .btn-wa .manada-icon     { background: linear-gradient(135deg, #25D366, #128C7E); }
    .btn-ig .manada-icon     { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
    .btn-web .manada-icon    { background: linear-gradient(135deg, #4a5840, #343f2c); }
    .btn-tt .manada-icon     { background: linear-gradient(135deg, #000000, #25F4EE); }
    .btn-google .manada-icon { background: linear-gradient(135deg, #4285F4, #34A853); }

    /* Textos del Botón */
    .manada-text {
      flex: 1;
      text-align: left;
    }

    .manada-text .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 12.5px;
      font-weight: 800;
      color: #3e4a35;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .manada-text .sub {
      font-size: 9.5px;
      color: #7d8b72;
      font-weight: 700;
      margin-top: 1px;
    }

    /* Cursor de mano interactivo */
    .hand-cursor {
      position: absolute;
      right: 12px;
      bottom: -5px;
      font-size: 15px;
      color: #3e4a35;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
      animation: tapGesture 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes tapGesture {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50% { transform: translateY(-4px) rotate(-5deg); }
    }

    /* Footer Fijo de Ubicación sobre la pastilla de la imagen */
    .btn-visitanos-touch {
      position: absolute;
      top: 86.2%;
      left: 8.5%;
      width: 83%;
      height: 8.2%;
      border-radius: 35px;
      z-index: 25;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-visitanos-touch:active {
      background-color: rgba(74, 88, 64, 0.15);
    }

    /* Horario inferior */
    .bottom-schedule-line {
      position: absolute;
      bottom: 0.8%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 26;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.7);
    }

    /* Capa de Huellas Interactivas (Burdeos) */
    #pawLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .paw-print {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.5s ease-in, transform 0.5s ease-out;
      filter: drop-shadow(0 1px 2px rgba(80, 10, 20, 0.3));
    }

    .paw-print.visible {
      opacity: 0.88;
      transform: scale(1);
    }

    .paw-print.fade-out {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }
  </style>
</head>
<body>
