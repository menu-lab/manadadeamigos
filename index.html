  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #e8e2d5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    /* Contenedor Adaptativo Single-Viewport: 900x1700 estricto */
    .app-container {
      position: relative;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      max-height: calc(100vw * (1700 / 900));
      aspect-ratio: 900 / 1700;
      background: #FFFFFF url('350594.jpg') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    /* Fallback para compatibilidad con la imagen sin botones */
    @supports not (background: url('350594.jpg')) {
      .app-container {
        background-image: url('350594.jpg - copia.jpg');
      }
    }

    /* Control de Sonido superior izquierdo */
    #soundToggle {
      position: absolute;
      top: 2.2%;
      left: 3.8%;
      width: 44px;
      height: 44px;
      z-index: 35;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(74, 88, 64, 0.2);
    }

    #soundIcon {
      width: 22px;
      height: 22px;
      fill: #4a5840;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #soundToggle.muted #soundIcon {
      opacity: 0.45;
      fill: #7d8b72;
    }

    /* ========================================================
       BOTONERA ESTILIZADA EN CÓDIGO (ESTILO MANADA DE AMIGOS)
       ======================================================== */
    .buttons-wrapper {
      position: absolute;
      top: 26.5%;
      left: 8.5%;
      width: 83%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
    }

    .manada-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 18px;
      background: #FFFFFF;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid #e5ded2;
      box-shadow: 0 4px 12px rgba(62, 74, 53, 0.08), 0 3px 0 #d1c6b4;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    }

    .manada-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 1px 4px rgba(62, 74, 53, 0.1), 0 1px 0 #d1c6b4;
    }

    /* Icono circular a la izquierda */
    .manada-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }

    /* Colores temáticos armonizados con la paleta de la marca */
    .btn-wa .manada-icon { background: linear-gradient(135deg, #25D366, #128C7E); }
    .btn-ig .manada-icon { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
    .btn-web .manada-icon { background: linear-gradient(135deg, #4a5840, #343f2c); }
    .btn-tt .manada-icon { background: linear-gradient(135deg, #000000, #25F4EE); }
    .btn-google .manada-icon { background: linear-gradient(135deg, #4285F4, #34A853); }

    /* Textos del Botón */
    .manada-text {
      flex: 1;
      text-align: left;
    }

    .manada-text .title {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: #3e4a35;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .manada-text .sub {
      font-size: 10.5px;
      color: #7d8b72;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Cursor de mano interactivo */
    .hand-cursor {
      position: absolute;
      right: 14px;
      bottom: -6px;
      font-size: 18px;
      color: #3e4a35;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
      animation: tapGesture 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes tapGesture {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50% { transform: translateY(-4px) rotate(-5deg); }
    }

    /* Footer Fijo Transparente sobre la pastilla de ubicación de la imagen */
    .btn-visitanos-touch {
      position: absolute;
      top: 86.2%;
      left: 8.5%;
      width: 83%;
      height: 8.2%;
      border-radius: 35px;
      z-index: 25;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-visitanos-touch:active {
      background-color: rgba(74, 88, 64, 0.15);
    }

    /* Horario inferior */
    .bottom-schedule-line {
      position: absolute;
      bottom: 0.8%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 9.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 26;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 0.7);
    }

    /* Capa de Huellas Interactivas (Burdeos) */
    #pawLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .paw-print {
      position: absolute;
      width: 22px;
      height: 22px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.5s ease-in, transform 0.5s ease-out;
      filter: drop-shadow(0 1px 2px rgba(80, 10, 20, 0.3));
    }

    .paw-print.visible {
      opacity: 0.88;
      transform: scale(1);
    }

    .paw-print.fade-out {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }
  </style>
</head>

  <script>
    // 1. Selector de Fondo Dinámico con verificación dual (.jpg / .jpeg)
    const appContainer = document.getElementById('appContainer');
    const currentMonth = new Date().getMonth();

    let baseFileName = null;

    if (currentMonth === 0 || currentMonth === 1) {
      baseFileName = 'base_enero_febrero';
    } else if (currentMonth === 2) {
      baseFileName = 'base_marzo';
    } else if (currentMonth === 8) {
      baseFileName = 'base_septiembre';
    } else if (currentMonth === 9) {
      baseFileName = 'base_octubre';
    } else if (currentMonth === 10) {
      baseFileName = 'base_noviembre';
    }

    function setAppBackground(baseName) {
      if (!baseName) {
        appContainer.style.backgroundImage = "url('350594.jpg')";
        return;
      }

      const testJpg = new Image();
      testJpg.onload = () => {
        appContainer.style.backgroundImage = `url('${baseName}.jpg')`;
      };
      testJpg.onerror = () => {
        const testJpeg = new Image();
        testJpeg.onload = () => {
          appContainer.style.backgroundImage = `url('${baseName}.jpeg')`;
        };
        testJpeg.onerror = () => {
          appContainer.style.backgroundImage = "url('350594.jpg')";
        };
        testJpeg.src = `${baseName}.jpeg`;
      };
      testJpg.src = `${baseName}.jpg`;
    }

    setAppBackground(baseFileName);

    // 2. Alternancia de pistas de audio por sesión
    const tracks = ['sonido1.mp3', 'sonido2.mp3'];
    let lastTrack = localStorage.getItem('lastPlayedTrack');
    let nextTrack = (lastTrack === 'sonido1.mp3') ? 'sonido2.mp3' : 'sonido1.mp3';
    localStorage.setItem('lastPlayedTrack', nextTrack);

    const audio = document.getElementById('bgMusic');
    audio.src = nextTrack;

    const soundIcon = document.getElementById('soundIcon');
