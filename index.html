<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Manada de Amigos - Pet Shop & Boutique</title>

  <!-- Favicon Oficial 32x32 px en Base64 (Patita verde oliva en fondo blanco puro) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Cellipse cx='16' cy='21' rx='7.5' ry='6' fill='%234a5840'/%3E%3Cellipse cx='8' cy='13' rx='2.5' ry='3.5' transform='rotate(-20 8 13)' fill='%234a5840'/%3E%3Cellipse cx='13' cy='9.5' rx='2.5' ry='3.8' transform='rotate(-6 13 9.5)' fill='%234a5840'/%3E%3Cellipse cx='19' cy='9.5' rx='2.5' ry='3.8' transform='rotate(6 19 9.5)' fill='%234a5840'/%3E%3Cellipse cx='24' cy='13' rx='2.5' ry='3.5' transform='rotate(20 24 13)' fill='%234a5840'/%3E%3C/svg%3E">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Manada de Amigos - Pet Shop & Boutique">
  <meta property="og:description" content="Más que mascotas, son familia. Conecta con nuestra manada en Seminario 850, Ñuñoa.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f7f3ec;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contenedor adaptativo continuo de borde a borde (900x1700) */
    .app-container {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      aspect-ratio: 900 / 1700;
      background-position: center top;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.18);
      transition: background-image 0.3s ease-in-out;
    }

    /* Control de Sonido superior izquierdo */
    #soundToggle {
      position: absolute;
      top: 2.2%;
      left: 3.8%;
      width: 10%;
      height: 5.5%;
      z-index: 35;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    #soundIcon {
      width: 60%;
      height: 60%;
      fill: #4a5840;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #soundToggle.muted #soundIcon {
      opacity: 0.45;
      fill: #7d8b72;
    }

    /* Botones táctiles transparentes */
    .touch-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 50px;
      z-index: 25;
      background: transparent;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .touch-btn:active {
      transform: scale(0.98);
      background-color: rgba(255, 255, 255, 0.18);
    }

    .btn-whatsapp { top: 27.2%; left: 8.5%; width: 83%; height: 8.2%; }
    .btn-instagram { top: 36.6%; left: 8.5%; width: 83%; height: 8.2%; }
    .btn-website { top: 46.0%; left: 8.5%; width: 83%; height: 8.2%; }
    .btn-tiktok { top: 55.4%; left: 8.5%; width: 83%; height: 8.2%; }

    /* Footer Fijo de Ubicación */
    .btn-visitanos {
      top: 86.2%;
      left: 8.5%;
      width: 83%;
      height: 8.2%;
      border-radius: 35px;
    }

    .btn-visitanos:active {
      background-color: rgba(74, 88, 64, 0.15);
    }

    /* Texto de Horario en una sola línea bajo el botón Visítanos */
    .bottom-schedule-line {
      position: absolute;
      top: 95.2%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #333d2e;
      letter-spacing: 0.2px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 26;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* Capa de Huellas Interactivas (color burdeos 22x22px) */
    #pawLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .paw-print {
      position: absolute;
      width: 22px;
      height: 22px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.5s ease-in, transform 0.5s ease-out;
      filter: drop-shadow(0 1px 2px rgba(80, 10, 20, 0.3));
    }

    .paw-print.visible {
      opacity: 0.88;
      transform: scale(1);
    }

    .paw-print.fade-out {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }
  </style>
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- Reproductor de Audio -->
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Botón Toggle de Sonido (Superior Izquierdo) -->
    <div id="soundToggle" class="muted" title="Activar/Desactivar Música">
      <svg id="soundIcon" viewBox="0 0 24 24">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </div>

    <!-- Capa de Huellas Interactivas -->
    <div id="pawLayer"></div>

    <!-- Botonera Central Interactiva -->
    <a href="https://wa.me/56941173661?text=Hola%20Manada%20de%20Amigos,%20me%20gustar%C3%ADa%20hacerles%20una%20consulta.%20Mi%20nombre%20es:%20" target="_blank" rel="noopener" class="touch-btn btn-whatsapp" title="WhatsApp"></a>
    <a href="https://www.instagram.com/manadadeamigos" target="_blank" rel="noopener" class="touch-btn btn-instagram" title="Instagram"></a>
    <a href="https://www.manadadeamigos.cl" target="_blank" rel="noopener" class="touch-btn btn-website" title="Sitio Web"></a>
    <a href="https://www.tiktok.com/@manada.de.amigos" target="_blank" rel="noopener" class="touch-btn btn-tiktok" title="TikTok"></a>

    <!-- Footer Fijo de Ubicación y Cómo Llegar -->
    <a href="https://www.google.com/maps/search/?api=1&query=Seminario+850+local+4,+Nunoa,+Santiago" target="_blank" rel="noopener" class="touch-btn btn-visitanos" title="Ubicación y Cómo llegar"></a>

    <!-- Horario en una sola línea bajo el botón Visítanos -->
    <div class="bottom-schedule-line">Horario: Lun-Vie 10:00 a 20:00 hrs | Sáb 09:00 a 14:00 hrs</div>
  </div>

  <script>
    // 1. Selector de Fondo Dinámico con verificación dual (.jpg / .jpeg)
    const appContainer = document.getElementById('appContainer');
    const currentMonth = new Date().getMonth();

    let baseFileName = null;

    if (currentMonth === 0 || currentMonth === 1) {
      baseFileName = 'base_enero_febrero';
    } else if (currentMonth === 2) {
      baseFileName = 'base_marzo';
    } else if (currentMonth === 8) {
      baseFileName = 'base_septiembre';
    } else if (currentMonth === 9) {
      baseFileName = 'base_octubre';
    } else if (currentMonth === 10) {
      baseFileName = 'base_noviembre';
    }

    function setAppBackground(baseName) {
      if (!baseName) {
        appContainer.style.backgroundImage = "url('350594.jpg')";
        return;
      }

      const testJpg = new Image();
      testJpg.onload = () => {
        appContainer.style.backgroundImage = `url('${baseName}.jpg')`;
      };
      testJpg.onerror = () => {
        const testJpeg = new Image();
        testJpeg.onload = () => {
          appContainer.style.backgroundImage = `url('${baseName}.jpeg')`;
        };
        testJpeg.onerror = () => {
          appContainer.style.backgroundImage = "url('350594.jpg')";
        };
        testJpeg.src = `${baseName}.jpeg`;
      };
      testJpg.src = `${baseName}.jpg`;
    }

    setAppBackground(baseFileName);

    // 2. Alternancia estricta entre sonido1 y sonido2 por sesión
    const tracks = ['sonido1.mp3', 'sonido2.mp3'];
    let lastTrack = localStorage.getItem('lastPlayedTrack');
    let nextTrack = (lastTrack === 'sonido1.mp3') ? 'sonido2.mp3' : 'sonido1.mp3';
    localStorage.setItem('lastPlayedTrack', nextTrack);

    const audio = document.getElementById('bgMusic');
    audio.src = nextTrack;

    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const iconMuted = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const iconActive = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          soundIcon.innerHTML = `<path d="${iconActive}"/>`;
        }).catch(err => console.warn(err));
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        soundIcon.innerHTML = `<path d="${iconMuted}"/>`;
      }
    });

    // 3. Motor de Huellas Dinámicas de Pantalla Completa (Burdeos)
    const pawLayer = document.getElementById('pawLayer');
    const container = document.getElementById('appContainer');

    const pawSVG = `
      <svg viewBox="0 0 100 100" fill="#6b1d2f" width="100%" height="100%">
        <ellipse cx="50" cy="65" rx="22" ry="18"/>
        <circle cx="24" cy="38" r="9"/>
        <circle cx="41" cy="27" r="9"/>
        <circle cx="59" cy="27" r="9"/>
        <circle cx="76" cy="38" r="9"/>
      </svg>
    `;

    let lastRouteIndex = -1;

    function getRandomTrajectory(W, H) {
      const routes = [
        { x0: -30, y0: H * 0.08, x1: W + 30, y1: H * 0.12 },
        { x0: -30, y0: -20, x1: W + 30, y1: H + 30 },
        { x0: -30, y0: H + 30, x1: W + 30, y1: -20 },
        { x0: W * 0.28, y0: -30, x1: W * 0.35, y1: H + 30 },
        { x0: W * 0.72, y0: H + 30, x1: W * 0.65, y1: -30 },
        { x0: W + 30, y0: H * 0.05, x1: -30, y1: H * 0.92 },
        { x0: W + 30, y0: H * 0.76, x1: -30, y1: H * 0.82 },
        { x0: -30, y0: H * 0.32, x1: W + 30, y1: H * 0.16 },
        { x0: -30, y0: H * 0.90, x1: W + 30, y1: H * 0.52 },
        { x0: -30, y0: H * 0.94, x1: W + 30, y1: H * 0.96 }
      ];

      let idx;
      do {
        idx = Math.floor(Math.random() * routes.length);
      } while (idx === lastRouteIndex && routes.length > 1);
      lastRouteIndex = idx;

      return routes[idx];
    }

    function walkPawsSequence() {
      const rect = container.getBoundingClientRect();
      const W = rect.width;
      const H = rect.height;

      const route = getRandomTrajectory(W, H);
      const totalDistance = Math.hypot(route.x1 - route.x0, route.y1 - route.y0);
      const stepDistance = 46;
      const steps = Math.floor(totalDistance / stepDistance);
      const angle = Math.atan2(route.y1 - route.y0, route.x1 - route.x0);
      const baseRotation = (angle * 180 / Math.PI) + 90;
      const stepSide = 12;

      for (let i = 0; i < steps; i++) {
        setTimeout(() => {
          const paw = document.createElement('div');
          paw.className = 'paw-print';
          paw.innerHTML = pawSVG;

          const currentDist = i * stepDistance;
          const sideOffset = (i % 2 === 0 ? 1 : -1) * stepSide;

          const posX = (route.x0 + Math.cos(angle) * currentDist) - Math.sin(angle) * sideOffset;
          const posY = (route.y0 + Math.sin(angle) * currentDist) + Math.cos(angle) * sideOffset;
          const rot = baseRotation + (i % 2 === 0 ? 6 : -6);

          paw.style.left = `${posX}px`;
          paw.style.top = `${posY}px`;
          paw.style.transform = `scale(0.4) rotate(${rot}deg)`;

          pawLayer.appendChild(paw);

          requestAnimationFrame(() => {
            paw.classList.add('visible');
            paw.style.transform = `scale(1) rotate(${rot}deg)`;
          });

          setTimeout(() => {
            paw.classList.remove('visible');
            paw.classList.add('fade-out');
            setTimeout(() => {
              paw.remove();
            }, 1200);
          }, 1500);

        }, i * 380);
      }
    }

    setTimeout(() => {
      walkPawsSequence();
      setInterval(walkPawsSequence, 10000);
    }, 3000);
  </script>
</body>
</html>
